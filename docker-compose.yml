# Local development stack: PostgreSQL + backend API + frontend.
#
#   docker compose up --build          start everything
#   docker compose run --rm backend npm run db:seed:prod    load demo data
#
# The credentials below are local development placeholders. Production
# deployments supply their own environment variables — see docs/deployment.md.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ceonhub
      POSTGRES_PASSWORD: ceonhub
      POSTGRES_DB: ceonhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceonhub -d ceonhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://ceonhub:ceonhub@db:5432/ceonhub?schema=public
      JWT_SECRET: local-development-only-secret-change-me-32chars
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      API_URL: http://localhost:4000
      # Same-site cookies work here because both apps are served from localhost.
      COOKIE_SAMESITE: lax
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/storage
    # Migrations run on start so a fresh clone needs no extra step.
    command: sh -c "npm run db:deploy && node dist/server.js"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
